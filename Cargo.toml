[package]
name = "chatgpt-handoff"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Turn a ChatGPT data export into a clean transcript and a compact continuation/handoff context package."
repository = "https://github.com/hemzaz/chatgpt-handoff"
homepage = "https://github.com/hemzaz/chatgpt-handoff"
license = "MIT OR Apache-2.0"
keywords = ["chatgpt", "openai", "export", "transcript", "handoff"]
categories = ["command-line-utilities", "text-processing"]
readme = "README.md"
exclude = ["/.github", "/tests"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
nucleo-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi", "std"] }
unicode-segmentation = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"
serde_json = "1"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[lib]
name = "chatgpt_handoff"
path = "src/lib.rs"

[[bin]]
name = "chatgpt-handoff"
path = "src/main.rs"

[profile.release]
strip = true
